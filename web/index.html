<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dot Matrix Cam</title>
  <!-- Inline icon (a green dot), so the browser doesn't request /favicon.ico. -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='%2339ff14'/%3E%3C/svg%3E" />
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0e0f11; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <canvas id="app"></canvas>
  <!-- Loader: everything else is Rust (crates/dotmatrix-app), compiled to WASM. -->
  <script type="module">
    import init, { start_app } from "./pkg/dotmatrix_app.js";
    await init();
    await start_app("app");
  </script>
</body>
</html>
