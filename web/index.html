<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dot Matrix Cam</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0e0f11; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <canvas id="app"></canvas>
  <!-- Loader: everything else is Rust (crates/dotmatrix-app), compiled to WASM. -->
  <script type="module">
    import init, { start_app } from "./pkg/dotmatrix_app.js";
    await init();
    await start_app("app");
  </script>
</body>
</html>
